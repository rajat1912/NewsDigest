openai:
  api_key: "${OPENAI_API_KEY}"  # Set via environment variable
  model: "gpt-4o-mini"

telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"  # Set via environment variable
  chat_id: 0  # Set via TELEGRAM_CHAT_ID environment variable

newsapi:
  api_key: "${NEWSAPI_API_KEY}"  # Get from https://newsapi.org (optional)

preferences:
  topics:
    - "cricket"
    - "ai"
    - "politics"
  languages:
    - "en"
  countries:
    - "in"
  num_articles: 12  # 4 articles for each of the 3 configured topics

rss:
  feeds:
    - "https://www.thehindu.com/news/national/feeder/default.rss"
    - "https://www.thehindu.com/sport/feeder/default.rss"
    - "https://timesofindia.indiatimes.com/rssfeeds/-2128936835.cms"
    - "https://feeds.bbci.co.uk/news/world/asia/india/rss.xml"
    - "https://feeds.bbci.co.uk/sport/football/rss.xml"
    - "https://indianexpress.com/section/india/feed/"
    - "https://indianexpress.com/section/technology/feed/"
    - "https://indianexpress.com/section/sports/football/feed/"
